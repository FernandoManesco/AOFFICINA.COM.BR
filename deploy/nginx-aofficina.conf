# /etc/nginx/sites-available/aofficina  — HTTP inicial (o certbot acrescenta o HTTPS)
# Site de venda
server {
    listen 80;
    server_name aofficina.com.br www.aofficina.com.br;
    root /home/deploy/aofficina/site;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location / { try_files $uri $uri/ =404; }
}

# App (frontend estático)
server {
    listen 80;
    server_name app.aofficina.com.br;
    root /home/deploy/aofficina/web;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ~* \.(js|css|png|svg|ico)$ { expires 1h; }
    location / { try_files $uri $uri/ =404; }
}

# API
server {
    listen 80;
    server_name api.aofficina.com.br;
    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
